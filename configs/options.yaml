version: 1
provider:
  name: futu_opend
  host: 127.0.0.1
  port: 11111
  market_snapshot_limit: 50
  option_chain_limit: 8
  market_snapshot_hot_reserved: 8
market:
  timezone: America/New_York
  calendar: XNYS
  session_start: "09:30"
  session_end: "16:00"
  max_dte: 180
collection:
  surface_interval_seconds: 60
  hot_interval_seconds: 5
  hot_reselect_seconds: 300
  surface_min_dte: 0
  surface_max_dte: 90
  surface_min_moneyness: 0.70
  surface_max_moneyness: 1.30
  hot_max_dte: 45
  hot_moneyness_min: 0.85
  hot_moneyness_max: 1.15
  hot_expiry_targets: [0, 7, 14, 28]
  hot_strikes_per_expiry: 12
  hot_cap_per_underlying: 96
  hot_reselect_price_change: 0.01
retention:
  # Raw 只作为压缩缓冲区:curated 与 raw 已逐行逐字段验证等价(见 ops/verify_raw_vs_curated.py),
  # 且清理前必须通过 manifest 哈希与行数对账,压缩失败时不会删除,故保留期可以很短。
  # 实际占用天数约为 max(raw_days, trash_days):trash 的计时基于目录原始 mtime(接近交易日),
  # 而非移入时刻,所以两者中较大的那个决定最终删除时间。
  raw_days: 1
  trash_days: 1
  warn_free_gb: 30
  stop_free_gb: 10
underlyings:
  - code: US.QQQ
    name: 纳斯达克100 ETF
  - code: US.TQQQ
    name: 纳指3倍做多
  - code: US.MSTR
    name: MicroStrategy
  - code: US.TSLA
    name: 特斯拉
