[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-data-hub"
version = "0.1.0"
description = "富途美股期权实时研究数据采集、治理与读取平台"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.0",
  "pyarrow>=12",
  "PyYAML>=6.0",
  "futu-api>=10.7",
  "exchange-calendars>=4.5",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
market-data = "market_data_hub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "live: requires a reachable local Futu OpenD gateway",
]
